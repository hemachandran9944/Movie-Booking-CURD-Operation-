version: '3.8'

services:

  nginx_balancer:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - theater-moviebooking-1
      - theater-moviebooking-2
      - theater-moviebooking-3
    networks:
      - booking_network

  theater-moviebooking-1:
    build: .
    container_name: theater-moviebooking-1
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy   
      mongodb:
        condition: service_started  
    networks:
      - booking_network

  theater-moviebooking-2:
    build: .
    container_name: theater-moviebooking-2
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - booking_network

  theater-moviebooking-3:
    build: .
    container_name: theater-moviebooking-3
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - booking_network

  mongodb:
    image: mongo:6
    container_name: booking_mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - booking_network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: booking_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - booking_network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: booking_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

networks:
  booking_network:
    driver: bridge

volumes:
  kafka_data:
  mongo_data: